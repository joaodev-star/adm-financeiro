{# Card de busca reutilizável. Espera: base_url, titulo_busca, placeholder, q, status #}
<div class="card">
  <div class="card-header">Buscar {{ titulo_busca }}</div>
  <div class="card-body">
    <form method="get" action="{{ base_url }}" class="row g-2 align-items-stretch">
      <div class="col-lg">
        <input type="text" name="q" value="{{ q }}" class="form-control form-control-lg" placeholder="{{ placeholder }}">
        <div class="form-text">Busca por mais de um elemento: separe os termos por espaço ou vírgula (todos precisam aparecer).</div>
      </div>
      <div class="col-lg-2">
        <select name="status" class="form-select form-select-lg" title="Situação">
          <option value="ATIVO" {% if status == 'ATIVO' %}selected{% endif %}>Ativos</option>
          <option value="INATIVO" {% if status == 'INATIVO' %}selected{% endif %}>Inativos</option>
          <option value="TODOS" {% if status == 'TODOS' %}selected{% endif %}>Ativos e inativos</option>
        </select>
      </div>
      <div class="col-auto">
        <button type="submit" name="acao" value="buscar" class="btn btn-primary btn-lg h-100 px-4"><i class="bi bi-search"></i><br>Buscar</button>
      </div>
      <div class="col-auto">
        <a href="{{ base_url }}?acao=todos" class="btn btn-success btn-lg h-100 px-4 d-flex flex-column justify-content-center"><i class="bi bi-list-ul"></i>Todos</a>
      </div>
    </form>
  </div>
</div>
