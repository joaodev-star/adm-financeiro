# Blueprint do Render (https://render.com) — cria o site e o banco PostgreSQL de uma vez.
services:
  - type: web
    name: adm-financeiro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adm-financeiro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash

databases:
  - name: adm-financeiro-db
    plan: free
    databaseName: adm_financeiro
    user: adm_financeiro
